<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Iron Sharpens Iron</title>
<meta name="description" content="Iron Sharpens Iron: 30-day Bible reading and fitness challenges for men.">
<meta name="theme-color" content="#0c0a09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/style.css">
<link rel="icon" type="image/png" href="/shared/logo.png">
<link rel="apple-touch-icon" href="/shared/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
<header class="header-bg">
<div class="header-inner">
  <div class="brand">
    <img class="brand-logo" src="/shared/logo.png" alt="Iron Sharpens Iron" width="72" height="67">
    <p class="mono" style="font-size:12px;color:#a8a29e;font-weight:500;letter-spacing:.025em">30-DAY CHALLENGE</p>
  </div>
  <a href="https://sharpiron.org" target="_blank" rel="noopener noreferrer" style="font-size:14px;color:#a8a29e;line-height:1.625;display:inline-flex;align-items:center;gap:6px">sharpiron.org <svg style="width:12px;height:12px;color:#78716c" viewBox="0 0 16 16" fill="none"><path d="M5 3h8v8M13 3L3 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
</div>
</header>
<div class="wrap" id="app"></div>
<script>
// Auto-load this month's plan. Folder convention: lowercase English month name
// (e.g. /june/, /july/). Drop in /<month>/config.js and root auto-switches on the 1st.
(function () {
  var MONTHS = ['january','february','march','april','may','june','july','august','september','october','november','december'];
  var monthName = MONTHS[new Date().getMonth()];
  var monthLabel = monthName.charAt(0).toUpperCase() + monthName.slice(1);

  function loadScript(src, ok, fail) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = ok;
    s.onerror = fail || function () {};
    document.head.appendChild(s);
  }

  function showFallback() {
    var a = document.getElementById('app');
    if (!a) return;
    a.innerHTML =
      '<div style="border-radius:16px;background:rgba(120,53,15,.2);border:1px solid rgba(180,83,9,.3);padding:24px;text-align:center;margin-top:20px">' +
      '<p style="font-size:18px;font-weight:600;color:#fde68a">No plan published for ' + monthLabel + ' yet.</p>' +
      '<p style="font-size:14px;color:#a8a29e;margin-top:8px">Pick a plan to start any time.</p>' +
      '<p style="margin-top:16px"><a href="/all/" style="display:inline-block;padding:10px 18px;background:#b45309;color:#fffbeb;font-weight:600;font-size:14px;border-radius:12px;text-decoration:none">Browse all plans</a></p>' +
      '</div>';
  }

  loadScript('/' + monthName + '/config.js', function () {
    loadScript('/shared/lang.js', function () {
      loadScript('/shared/app.js');
    });
  }, showFallback);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
